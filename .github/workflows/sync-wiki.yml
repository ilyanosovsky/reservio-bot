# Mirrors docs/wiki/ (source of truth, PR-reviewed) into the GitHub Wiki tab.
# Runs on every merge to main that touches docs/wiki/ or the sync tooling;
# can also be run manually from the Actions tab.
name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "scripts/sync-wiki.py"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write # GITHUB_TOKEN's contents scope also covers the wiki repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki repo
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sync pages
        run: python3 scripts/sync-wiki.py /tmp/wiki

      - name: Push if changed
        run: |
          cd /tmp/wiki
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "wiki already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync from docs/wiki @ ${GITHUB_SHA::7}"
          git push
